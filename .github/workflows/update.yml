name: 블로그 글 자동 갱신

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 (한국 시간)
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사이트 생성
        run: python build_site.py --site-url https://yoondlecom-spec.github.io/papas-camping
      - name: 변경이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "블로그 글 자동 갱신"
            git push
          fi
